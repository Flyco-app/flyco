<!doctype html>
<html lang="en">
  <body>
    <h1>Reset your Flyco password</h1>
    <p>A password reset was requested for your account.</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=%2Ffr%2Fnew-password"
        >Continue securely</a
      >
    </p>
    <p>
      This single-use link expires shortly. If you did not request it, ignore
      this email.
    </p>
  </body>
</html>
